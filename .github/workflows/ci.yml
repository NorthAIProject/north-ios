name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Cache derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-derived-data-${{ hashFiles('khepri.xcodeproj/project.xcworkspace/contents.xcworkspacedata') }}
          restore-keys: |
            ${{ runner.os }}-xcode-derived-data-

      - name: Cache SwiftPM repositories
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Resolve Package Dependencies (retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            xcodebuild -project khepri.xcodeproj -scheme khepri -resolvePackageDependencies && break
            echo "Resolve attempt $i failed; retrying in 20s..."
            sleep 20
          done

      - name: Build (no tests) to surface Swift errors
        run: |
          xcodebuild build \
            -project khepri.xcodeproj \
            -scheme khepri \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Resolve a simulator
        id: sim
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available \
            | grep -E '^\s+iPhone' \
            | head -1 \
            | grep -oE '[0-9A-Fa-f-]{36}' || true)"
          if [ -z "$udid" ]; then
            echo "::error::No iOS simulator available on this runner. Available destinations:"
            xcodebuild -project khepri.xcodeproj -scheme khepri -showdestinations 2>&1 | sed -n '1,40p'
            exit 1
          fi
          name="$(xcrun simctl list devices available | grep "$udid" | sed -E 's/^ *([^(]+) \(.*/\1/')"
          echo "Using simulator: $name ($udid)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project khepri.xcodeproj \
            -scheme khepri \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:khepriTests \
            -parallel-testing-enabled NO \
            -quiet

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
