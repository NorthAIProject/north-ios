# One-time (re-runnable) seeding of the match certificates repo.
#
# Release runs match in readonly mode, so every bundle ID it signs must
# already have an App Store profile in NorthAIProject/north-ios-certificates.
# Dispatch this by hand whenever signing assets need to be (re)generated:
# a new target (the Share Extension), a new entitlement, or an expired
# certificate. The bundle IDs themselves must be registered in the Apple
# Developer portal first; match creates profiles, not App IDs.
#
# Needs the same secrets as Release, but MATCH_GIT_BASIC_AUTHORIZATION's token
# must have Contents: Read AND Write on north-ios-certificates for this
# workflow, since it pushes the new profiles.
name: Seed signing

on:
  workflow_dispatch:

concurrency:
  group: ios-seed-signing
  cancel-in-progress: false

jobs:
  seed:
    name: match appstore (readwrite)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fastlane seed_signing
        run: bundle exec fastlane seed_signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
